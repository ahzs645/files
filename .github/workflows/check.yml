name: Check
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: files
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: files
      - name: Read the qualified host source
        id: host
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const host = JSON.parse(readFileSync('zoer/host-source.json', 'utf8'));
          if (!/^[a-f0-9]{40}$/.test(host.commit)) throw Error('The Zoer source must be pinned to a commit.');
          appendFileSync(process.env.GITHUB_OUTPUT, `ref=${host.commit}\nbun=${host.bunVersion}\nnode=${host.nodeVersion}\n`);
          NODE
      - name: Require host source access
        env:
          HAS_HOST_TOKEN: ${{ secrets.ZOER_SOURCE_TOKEN != '' }}
        run: |
          if [ "$HAS_HOST_TOKEN" != true ]; then
            echo "::error::ZOER_SOURCE_TOKEN must provide read access to ahzs645/zoer for the integration checks. Fork PRs need a trusted maintainer branch; these checks must not run with pull_request_target."
            exit 1
          fi
      # Keep the same sibling layout as local development. TypeScript and the
      # host-contract tests import ../zoer; a nested .zoer-host checkout differs.
      - name: Check out the qualified Zoer host
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ahzs645/zoer
          ref: ${{ steps.host.outputs.ref }}
          token: ${{ secrets.ZOER_SOURCE_TOKEN }}
          persist-credentials: false
          path: zoer
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.host.outputs.node }}
          cache: npm
          cache-dependency-path: files/package-lock.json
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.host.outputs.bun }}
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          (cd ../zoer && bun install --frozen-lockfile --filter zoer-frontend --ignore-scripts)
      # Convex's complete generated bridge is versioned. A check must not rely on
      # partial AnyApi stubs written before a deliberately ignored codegen error.
      - name: Typecheck
        run: |
          npm run typecheck
          npm run zoer:typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test
        run: npm test
      - name: Test catalog queries in the Bun host runner
        run: npm run zoer:test:catalog
      - name: Build and test the bundled worker
        run: npm run zoer:test:worker
